<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F0EBE3;
      color: #3D2E5E;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }

    /* ── Decorative blobs ── */
    .blob-orange {
      position: fixed;
      top: -30px; right: -30px;
      width: 220px; height: 200px;
      background: #F9C97A;
      border-radius: 0 0 0 80%;
      z-index: 0;
    }
    .blob-pink {
      position: fixed;
      bottom: -10px; left: 30px;
      width: 80px; height: 100px;
      z-index: 0;
    }
    .sparkle {
      position: fixed;
      z-index: 0;
      color: #5CBFBA;
      font-size: 28px;
      line-height: 1;
    }
    .sparkle-1 { top: 60px;  left: 50px;  font-size: 20px; }
    .sparkle-2 { top: 90px;  left: 80px;  font-size: 14px; }
    .sparkle-3 { top: 140px; left: 35px;  font-size: 16px; }
    .dot-group  { position: fixed; top: 160px; right: 80px; z-index: 0; }

    /* ── Page wrapper ── */
    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      border: 2.5px solid #8B6CC8;
      border-radius: 20px;
      background: #F5F0EB;
      padding: 32px 28px 28px;
      box-shadow: 0 4px 32px rgba(139,108,200,0.10);
    }

    .page-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #7B5CC8;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* ── Diagram wrapper ── */
    .diagram-wrapper {
      width: 100%;
      background: #E8F4F3;
      border-radius: 16px;
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    footer {
      margin-top: 16px;
      font-size: 0.72rem;
      color: #9B8EBE;
      text-align: center;
      letter-spacing: 0.3px;
    }
